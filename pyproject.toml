[project]
name = "wattzan"
version = "16.2.9"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<0.15",
    "scipy>=1.13,<2",
    "joblib>=1.4,<2",
    "sqlmodel>=0.0.22,<1",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "backend.server:app"
